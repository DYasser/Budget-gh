name: Deploy to GitHub Pages

# Runs only after CI has passed on main, so a red build is never published.
on:
  workflow_run:
    workflows: ['CI']
    branches:
      - main
    types:
      - completed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production --base-href /Budget-io/

      # GitHub Pages serves index.html for unknown paths only via 404.html, which is
      # how client-side routes survive a hard refresh.
      - name: Copy index.html to 404.html
        run: cp dist/budget-io/browser/index.html dist/budget-io/browser/404.html

      # publish_dir replaces the target repository's contents wholesale, so the
      # artifact repo's README has to be generated into the bundle rather than
      # committed there by hand.
      - name: Add deployment README
        run: cp deploy/README.deploy.md dist/budget-io/browser/README.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: DYasser/Budget-io
          publish_branch: main
          publish_dir: ./dist/budget-io/browser
