name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # ubuntu-latest ships Chrome; point karma at it explicitly rather than
      # relying on it being auto-detected.
      - name: Test
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build
        run: npm run build
