name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # so the gate can be run by hand from the Actions tab

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Karma needs a real browser. Install one and take its path from the action's
      # output rather than hardcoding /usr/bin/google-chrome: the binary name varies
      # across runner images (google-chrome, google-chrome-stable, chromium).
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build
        run: npm run build
